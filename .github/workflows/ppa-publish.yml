name: Publish Ubuntu PPA package

on:
  workflow_run:
    workflows: ["Create GitHub Release"]
    types:
      - completed

jobs:
  check-main:
    name: Check release succeeded and tag is on main
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
      tag: ${{ github.event.workflow_run.head_branch }}

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Check tag targets main
        id: check
        run: |
          tag="${{ github.event.workflow_run.head_branch }}"
          sha="${{ github.event.workflow_run.head_sha }}"
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$tag does not point to a commit on main -- skipping publish. Tag a commit on main to publish."
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

  ppa-publish:
    name: Build and upload to PPA
    needs: check-main
    if: needs.check-main.outputs.on_main == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.check-main.outputs.tag }}

      - name: Resolve version
        id: resolve
        run: |
          tag="${{ needs.check-main.outputs.tag }}"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y build-essential devscripts dpkg-dev debhelper gnupg dput

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "GPG_KEYID=$keyid" >> "$GITHUB_ENV"

          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "default-cache-ttl 3600" >> ~/.gnupg/gpg-agent.conf
          echo "max-cache-ttl 3600" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --reload gpg-agent

          # Warm up the agent's passphrase cache so debuild/debsign's later,
          # non-interactive gpg calls (which can't supply --passphrase
          # themselves) reuse the already-unlocked key instead of prompting.
          echo "warmup" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" --local-user "$keyid" \
            --sign --armor --output /dev/null

      - name: Build and upload
        run: bash packaging/ppa/build-and-upload.sh "${{ steps.resolve.outputs.version }}" --upload
