name: Publish AUR package

on:
  workflow_run:
    workflows: ["Create GitHub Release"]
    types:
      - completed

jobs:
  check-main:
    name: Check release succeeded and tag is on main
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
      tag: ${{ github.event.workflow_run.head_branch }}

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Check tag targets main
        id: check
        run: |
          tag="${{ github.event.workflow_run.head_branch }}"
          sha="${{ github.event.workflow_run.head_sha }}"
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$tag does not point to a commit on main -- skipping publish. Tag a commit on main to publish."
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

  aur-publish:
    name: Update AUR package
    needs: check-main
    if: needs.check-main.outputs.on_main == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.check-main.outputs.tag }}

      - name: Resolve version and checksum
        id: resolve
        run: |
          tag="${{ needs.check-main.outputs.tag }}"
          version="${tag#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${tag}.tar.gz"
          curl -fsSL -o source.tar.gz "$url"
          sha256=$(sha256sum source.tar.gz | cut -d' ' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD
        run: |
          sed -i \
            -e "s/^pkgver=.*/pkgver=${{ steps.resolve.outputs.version }}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('${{ steps.resolve.outputs.sha256 }}')/" \
            packaging/aur/PKGBUILD
          cat packaging/aur/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: nautilus-my-computer
          pkgbuild: ./packaging/aur/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ needs.check-main.outputs.tag }}"
